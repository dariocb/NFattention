# Default Configuration for Text Sequence Classification Benchmark
# ==================================================================

# 实验设置
experiment:
  name: "text_seq_classification"
  seeds: [0, 1, 2, 3, 4]          # 多随机种子
  use_cv: true                     # 是否使用交叉验证
  n_folds: 10                      # 交叉验证折数
  output_dir: "results"            # 结果输出目录
  
# 数据集设置
datasets:
  - name: "rt_polarity"
    enabled: true
    use_cv: true
    
  - name: "sst2"
    enabled: true
    use_cv: false                  # 使用官方 split
    
  - name: "sst5"
    enabled: true
    use_cv: false
    
  - name: "trec"
    enabled: true
    use_cv: false
    
  - name: "ag_news"
    enabled: true
    use_cv: false
    
  - name: "dbpedia"
    enabled: true
    use_cv: false
    
  - name: "yelp_review_full"
    enabled: true
    use_cv: false

# 模型设置
models:
  # Standard Transformer baseline
  - name: "transformer"
    enabled: true
    
  # MIKAN baseline (Implicit Kernel Attention)
  - name: "mikan"
    enabled: true
  
  # MGK baseline (Mixture of Gaussian Keys)
  - name: "mgk"
    enabled: true
    
  # Performer baseline (FAVOR+ linear attention)
  - name: "performer"
    enabled: true
    
  # RKA baseline (Random Kernel Attention with learned features)
  - name: "rka"
    enabled: true
    
  # GMM-RKS baseline (Gaussian Mixture Random Kitchen Sinks)
  - name: "gmm_rks"
    enabled: true
    
  # Our method with frozen Q, K projections
  - name: "ours_fixed_qk"
    enabled: true
    
  # Our method with trainable Q, K projections
  - name: "ours_trainable_qk"
    enabled: true

  # Our latest variant: single shared kernel + head-id embedding
  - name: "ours_latest_head_kernel"
    enabled: true

# 模型超参数
model_params:
  # 共享参数
  embed_dim: 128                   # 词嵌入维度
  hidden_dim: 128                  # 隐藏层维度
  n_heads: 4                       # 注意力头数
  n_layers: 2                      # Transformer 层数
  pf_dim: 256                      # FFN 维度
  dropout: 0.1                     # Dropout 率
  max_seq_len: 256                 # 最大序列长度
  
  # Kernel Attention 特定参数
  M: 64                            # 随机特征数量 (MIKAN, Ours)
  n_features: 64                   # 特征数量 (Performer, RKA, GMM-RKS)
  n_dims: 64                       # 特征维度 (GMM-RKS)
  prior_var: 1.0                   # 先验方差
  kl_lambda: 0.001                 # KL 散度权重
  copula_lambda: 0.001             # Copula 熵权重
  att_dropout: 0.1                 # Attention dropout
  p_norm: 2                        # Norm 类型
  orthogonal: false                # 是否使用正交随机矩阵 (Performer, GMM-RKS)

# 训练超参数
training:
  batch_size: 32
  learning_rate: 0.001
  weight_decay: 0.0001
  n_epochs: 50
  patience: 10                     # Early stopping patience
  scheduler: "cosine"              # 学习率调度器: "cosine", "step", "none"
  warmup_epochs: 5
  gradient_clip: 1.0               # 梯度裁剪

# 评估指标
evaluation:
  primary_metric: "accuracy"       # 主指标
  additional_metrics: ["f1_macro"] # 额外指标
  
# 日志设置
logging:
  level: "INFO"
  save_model: true                 # 是否保存模型
  save_predictions: false          # 是否保存预测结果
